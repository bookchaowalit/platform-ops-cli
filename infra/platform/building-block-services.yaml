# Building-block services shared by every Solo Empire app.
#
# One catalog answers, for each horizontal capability an app may need:
#   - build it centrally, buy it from a provider, or hybrid (our logic + provider rail)
#   - which provider is the Solo default and which are fallbacks
#   - how an app reaches it (central gateway route, public SDK key, edge config,
#     platform-injected connection, or shared library)
#   - what already exists in this repository
#
# Apps never embed provider secrets. Provider credentials live in Infisical and are
# read only by the central gateway or platform layer that owns the capability.
# This file is a routing and decision contract; it does not deploy or enable a
# provider. Validate with `task platform:services:check`.

schema_version: solo-empire.building-block-services.v1
version: 1
updated: 2026-10-04
deployment_enabled: false
related:
  providers: infra/platform/cloud-providers.yaml
  external_apps: bookchaowalit/platform-integrations-api:data/external_app_registry.ts
  runtime_services: bookchaowalit/platform-infra-kit:infra/platform/PLATFORM-SERVICES.yaml
  ai_gateway: systems/ai-data/central-ai-gateway.md
  gpu_workers: infra/platform/gpu-worker-catalog.json

policy:
  rule: Build what differentiates the product; buy what is a commodity or needs regulated data, rails, or threat intelligence.
  apps_embed_provider_secrets: false
  regulated_requires_approval: true
  start_small: Begin with Postgres + Redis + object storage; add Kafka, warehouses, or data lakes only with a measured need.
  build_ceiling: A service with difficulty 4 or more is never built in-house; difficulty 5 is always bought.

scales:
  decision:
    build: Central Solo Empire code owns the logic; at most a commodity library underneath.
    hybrid: Central code owns the workflow and data model; a provider supplies the rail, data, or model.
    buy: A provider owns the capability; Solo Empire owns only the adapter, contract, and audit trail.
  difficulty:
    1: "🟢 straightforward business code"
    2: "🟡 buildable with a mature library; security-sensitive"
    3: "🟠 operationally heavy; build only with a clear reason"
    4: "🔴 needs data, rails, models, or certification we do not have"
    5: "🔴🔴 regulated or planet-scale; never build"
  status:
    live: Central implementation runs and is used by at least one app.
    partial: A central boundary exists (adapter, webhook, read-only check) but not the full capability.
    planned: Decision and provider are set; no central implementation yet.
    deferred: Deliberately not adopted until a product needs it.
  phase:
    now: Every new app should use it from day one.
    next: Implement in the next platform increment.
    later: Implement when two or more apps need it.
    on_demand: Adopt only for a product that requires it.
  access:
    gateway: Apps call the central Solo Empire API with a scoped Bearer token.
    sdk: Apps load a provider SDK with a public (non-secret) key only.
    edge: Configured once at the Cloudflare edge in front of every app.
    platform: Injected by the hosting platform (connection string or binding from Infisical).
    library: Shared package under packages/ or a vetted open-source library.

defaults:
  status: planned
  phase: on_demand
  data_class: internal
  approval: false

categories:
