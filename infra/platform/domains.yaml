# Domain and subdomain registry for bookchaowalit.com — single source of truth.
#
# Every hostname Solo Empire uses lives under one zone. This file records the
# zone facts, the naming convention, and every platform subdomain with its
# target runtime. The large portfolio fleet bound in Vercel is not listed by
# hand; it is captured by `task domains:snapshot` into
# repository-catalog/snapshots/bookchaowalit-subdomains.json and checked against
# this file by `task domains:check` (infra/scripts/platform/domains_registry.py).
#
# Changing DNS or binding a domain is an external action: edit this file first,
# get owner approval, apply through the provider, then re-run the snapshot.
schema_version: solo-empire.domains.v1
zone: bookchaowalit.com
registrar_dns: cloudflare
nameservers: [dina.ns.cloudflare.com, nico.ns.cloudflare.com]
apex:
  target: vercel
  project: bookchaowalit-portfolio-frontend
  note: apex and www are proxied by Cloudflare to the Vercel portfolio (redirects to /en)
wildcard:
  record: "*.bookchaowalit.com CNAME cname.vercel-dns.com"
  meaning: >-
    Any hostname without an explicit record resolves to Vercel. A subdomain only
    serves after it is bound to a Vercel project. A non-Vercel target (Railway,
    Workers, Render, Better Stack) needs an explicit Cloudflare record, which
    overrides the wildcard.
  observed: 2026-10-03

naming:
  rules:
    - one hostname per product or service, lowercase kebab-case, no environment suffix in production
    - platform services use short reserved names (api, mcp, hooks, hub, data, app)
    - portfolio and demo frontends keep the product name (e.g. recipe, sales, regex)
    - previews and staging use <name>-staging, never a nested subdomain
    - admin or personal surfaces must sit behind Cloudflare Access (access: protected)
  forbidden_prefixes: [test-, tmp-, old-]

statuses:
  live: bound, serving, and verified by the latest snapshot
  reserved: name claimed in this registry; not bound yet
  planned-repoint: currently serves something else; repoint only with owner approval
  retire: scheduled for removal from the provider

