# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# This repository also holds the Railway runner image source (infra/ci-runner); CI does not build it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra-python:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: infra
      python-version: "3.12"
      # ~300 of the ~340 Python files predate Ruff formatting; reformatting them all in this PR
      # would hide any real change. Format in a dedicated follow-up, then turn this back on.
      format-check: false
      # The repo's own runner: every infra/tests/**/*_test.py script in its own interpreter, with
      # the production Tasks API disabled. Absent sibling checkouts make tests skip themselves.
      # Route/ownership tests call the Task CLI, so install the version pinned in .task-version
      # (official release, verified against a pinned SHA-256).
      test-command: |
        TASK_VERSION="$(cat ../.task-version)"
        [ "$TASK_VERSION" = 3.53.1 ] || { echo "::error::.task-version changed; update the pinned Task checksum in ci.yml"; exit 1; }
        curl -fsSL -o "$RUNNER_TEMP/task.tar.gz" "https://github.com/go-task/task/releases/download/v${TASK_VERSION}/task_linux_amd64.tar.gz"
        echo "a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7  $RUNNER_TEMP/task.tar.gz" | sha256sum -c -
        mkdir -p "$HOME/.local/bin" && tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$HOME/.local/bin" task
        export PATH="$HOME/.local/bin:$PATH"
        python tests/run_all.py --jobs 4

  infra-node:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: infra
      node-version: "22"
      # The npm `test` script runs the Python suite, which the infra-python job already covers.
      test-command: ""

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
